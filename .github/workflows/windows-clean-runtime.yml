name: Build clean Windows GDAL runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install SWIG
        shell: pwsh
        run: choco install swig --yes --no-progress

      - name: Build and verify runtime
        shell: pwsh
        run: ./ci/compile-clean-runtime.ps1

      - name: Upload runtime
        uses: actions/upload-artifact@v5
        with:
          name: gdal-windows-x64-clean-runtime
          path: out/gdal-windows-x64-clean-runtime.zip
          if-no-files-found: error
          retention-days: 14
